<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYjWjRVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>

<body>
    <h1>My Interactive Dashboard</h1>

    <p>This dashboard was created by Ashika Negi for the WEB-115 course at Wake Tech</p>

    <p>This dashboard demonstrates how JavaScript can be used to create interactive websites.</p>

    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>

    <div class="container">
        <div class="row">

            <div class="col" id="weekly-tasks">

                <form>
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" name="user-name">

                    <label for="daily-goal">Daily Task Goal:</label>
                    <input type="number" id="daily-goal" name="daily-goal">

                    <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks" name="bonus-tasks">

                    <button type="submit" id="goal-btn">Calculate Goal</button>
                </form>

                <p id="goal-message"></p>

                <script src="js/task-manager.js"></script>

            </div>

            <div class="col" id="metric-converter">

                <form>
                    <label for="metric-value">Value:</label>
                    <input type="number" id="metric-value" name="metric-value">

                    <label for="conversion-type">Conversion:</label>
                    <select id="conversion-type" name="conversion-type">
                        <option value="inch-to-centimeter">inch to centimeter</option>
                        <option value="foot-to-centimeter">foot to centimeter</option>
                        <option value="yard-to-meter">yard to meter</option>
                        <option value="mile-to-kilometer">mile to kilometer</option>
                        <option value="centimeter-to-inch">centimeter to inch</option>
                        <option value="centimeter-to-foot">centimeter to foot</option>
                        <option value="meter-to-yard">meter to yard</option>
                        <option value="kilometer-to-mile">kilometer to mile</option>
                    </select>

                    <button type="submit" id="convert-btn">Convert</button>
                </form>

                <p id="conversion-result"></p>

                <script defer src="js/metric-converter.js"></script>

            </div>

            <div class="col" id="magic-eight-ball">
                <script src="js/magic-eight-ball.js" defer></script>
                <link rel="stylesheet" href="css/magic-eight-ball.css">
                <h2 class="heading">Magic Eight Ball</h2>
                <form>
                    <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                    <input id="question" name="question" size="80">
                    <div id="magicEightBall">
                        <div id="circle"></div>
                        <img id="ball" src="img/magic-eight-ball.png"/>
                    </div>
                    <button id="reset" name="reset" type="reset">Ask another question</button>
                </form>
                <br>
            </div>

        </div>
    </div>
</body>
</html>
